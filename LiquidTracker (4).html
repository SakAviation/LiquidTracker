<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LiquidTracker · Live flight tracker</title>
<meta name="theme-color" content="#05080f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316a34a'/%3E%3Cg transform='translate(32 32) rotate(45) scale(1.45)'%3E%3Cpath fill='%23fff' d='M0-15c1.3 0 2 1.4 2 3.2V-4l12 6.2v2.6L2 1.6v7.3l3.6 2.7v2.2L0 12.6l-5.6 1.2v-2.2L-2 8.9V1.6l-12 3.2V2.2L-2-4v-7.8C-2-13.6-1.3-15 0-15z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#f2f6fb;--mute:#9aa7b8;--g:#22c55e;--gd:#16a34a;--glass:rgba(16,22,34,.55);--gb:rgba(255,255,255,.16);--gh:rgba(255,255,255,.22);--ease:cubic-bezier(.2,.9,.3,1);--spring:cubic-bezier(.3,1.4,.5,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05080f;color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#map{position:fixed;inset:0;background:#0a0f18}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--gb);box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 var(--gh)}
button{font:inherit;color:inherit;cursor:pointer}
/* top bar */
#top{position:fixed;z-index:1000;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:10px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 9px;border-radius:99px;font-weight:800;letter-spacing:-.01em}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--gd);display:grid;place-items:center}
.brand i svg{width:16px;height:16px;fill:#fff;transform:rotate(45deg)}
.brand b{color:var(--g)}
#search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;padding:0 14px;height:44px;border-radius:99px}
#search svg{width:17px;height:17px;flex:none;color:var(--mute)}
#q{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit;min-width:0}
#q::placeholder{color:var(--mute)}
#stat{margin-left:auto;padding:9px 14px;border-radius:99px;font-size:.82rem;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:8px}
#stat b{color:var(--ink)}
#dot{width:8px;height:8px;border-radius:50%;background:#64748b}
#dot.live{background:var(--g);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.8s infinite}
#dot.err{background:#ef4444}
@keyframes pulse{to{box-shadow:0 0 0 9px rgba(34,197,94,0)}}
#results{position:fixed;z-index:1001;top:calc(64px + env(safe-area-inset-top));left:12px;width:min(420px,calc(100vw - 24px));border-radius:20px;padding:6px;display:none;max-height:50vh;overflow:auto}
#results.on{display:block}
#results button{display:flex;width:100%;justify-content:space-between;gap:10px;padding:10px 12px;border:0;background:none;border-radius:14px;text-align:left}
#results button:hover{background:rgba(255,255,255,.08)}
#results small{color:var(--mute)}
/* side buttons */
#side{position:fixed;z-index:1000;right:12px;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#side button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gb);transition:transform .3s var(--spring)}
#side button:hover{transform:scale(1.08)}#side button:active{transform:scale(.92)}
#side button svg{width:19px;height:19px}
#side .lbl{font-size:.68rem;font-weight:800;letter-spacing:.04em}
/* legend */
#legend{position:fixed;z-index:999;left:12px;bottom:calc(24px + env(safe-area-inset-bottom));padding:8px 12px;border-radius:14px;font-size:.7rem;color:var(--mute)}
#legend .bar{width:180px;height:6px;border-radius:6px;margin:5px 0 3px;background:linear-gradient(90deg,#facc15,#22c55e,#06b6d4,#3b82f6,#a855f7,#ec4899)}
#legend .ticks{display:flex;justify-content:space-between}
/* plane icons */
.pl{width:28px;height:28px;margin:-14px 0 0 -14px;transition:filter .2s}
.pl svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.pl svg path{stroke:rgba(0,0,0,.55);stroke-width:.8}
.pl.sel svg{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.pl.emg svg path{fill:#ef4444!important}
.pl.emg::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid #ef4444;animation:ring 1.4s infinite}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
.leaflet-container{background:#0a0f18;font:inherit}
.leaflet-control-attribution{background:rgba(5,8,15,.6)!important;color:#7d8899!important;font-size:10px}
.leaflet-control-attribution a{color:#9aa7b8!important}
/* info sheet */
#sheet{position:fixed;z-index:1002;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:min(380px,calc(100vw - 24px));border-radius:28px;padding:18px;transform:translateY(120%);opacity:0;transition:transform .55s var(--ease),opacity .3s}
#sheet.on{transform:none;opacity:1}
#sheet .x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--gb);background:rgba(255,255,255,.06);font-size:1.1rem}
.cs{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--mute);font-size:.88rem;margin-top:2px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badges span{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--gb)}
.badges .ph{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.5);color:#86efac}
.badges .em{background:rgba(239,68,68,.25);border-color:#ef4444;color:#fecaca}
.brief{margin-top:14px;padding:12px 14px;border-radius:18px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);font-size:.92rem;line-height:1.5}
.brief small{display:block;color:var(--g);font-size:.66rem;font-weight:800;letter-spacing:.12em;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.grid div span{display:block;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.grid div b{font-size:1.05rem}
.grid div b small{font-size:.72rem;color:var(--mute);font-weight:600;margin-left:2px}
.links{display:flex;gap:8px;margin-top:14px}
.links a{flex:1;text-align:center;padding:9px;border-radius:99px;text-decoration:none;color:var(--ink);font-size:.84rem;font-weight:600;border:1px solid var(--gb);background:rgba(255,255,255,.06)}
.links a:first-child{background:var(--gd);border-color:var(--gd)}
#toast{position:fixed;z-index:1003;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;padding:9px 16px;border-radius:99px;font-size:.84rem;transition:.35s var(--ease);pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:700px){
  .brand span{display:none}.brand{padding:8px}
  #stat .t{display:none}
  #search{min-width:0;padding:0 12px}
  #stat{padding:9px 11px;flex:none}
  #top{gap:7px;left:8px;right:8px}
  #legend{display:none}
  #sheet{left:8px;right:8px;width:auto;bottom:calc(8px + env(safe-area-inset-bottom))}
  #side{bottom:calc(16px + env(safe-area-inset-bottom))}
  body.sheet-on #side{opacity:0;pointer-events:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ap{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;padding:3px 9px 3px 3px;border-radius:99px;white-space:nowrap;cursor:pointer;
  background:rgba(10,15,24,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.35);box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .3s var(--spring)}
.ap:hover{transform:translate(-50%,-50%) scale(1.1)}
.ap i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#334155}
.ap i svg{width:13px;height:13px;fill:#fff}
.ap b{font-size:.72rem;letter-spacing:.04em}
.ap.home i{background:var(--gd)}
.ap.home{border-color:rgba(74,222,128,.7)}
body.ap-min .ap:not(.home){padding:3px}body.ap-min .ap:not(.home) b{display:none}
#srcl{display:block;font-size:.66rem;color:var(--mute);margin-top:1px}
#stat{cursor:pointer}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="brand glass"><i><svg viewBox="-16 -16 32 32"><path d="M0-15c1.3 0 2 1.4 2 3.2V-4l12 6.2v2.6L2 1.6v7.3l3.6 2.7v2.2L0 12.6l-5.6 1.2v-2.2L-2 8.9V1.6l-12 3.2V2.2L-2-4v-7.8C-2-13.6-1.3-15 0-15z"/></svg></i><span>Liquid<b>Tracker</b></span></div>
  <label id="search" class="glass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search flight, registration or type" autocomplete="off" spellcheck="false"></label>
  <div id="stat" class="glass"><i id="dot"></i><span><b id="cnt">0</b> <span class="t">planes in view</span><small id="srcl"></small></span></div>
</div>
<div id="results" class="glass"></div>

<div id="side">
  <button class="glass" id="bKti" title="Go to KTI · Techo International"><span class="lbl">KTI</span></button>
  <button class="glass" id="bMe" title="My location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
  <button class="glass" id="bWorld" title="Whole world"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg></button>
</div>

<div id="legend" class="glass">Altitude (ft)<div class="bar"></div><div class="ticks"><span>0</span><span>10k</span><span>20k</span><span>30k</span><span>40k+</span></div></div>

<div id="sheet" class="glass" role="dialog" aria-label="Flight details"></div>
<div id="toast" class="glass"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const PATH='M0-15c1.3 0 2 1.4 2 3.2V-4l12 6.2v2.6L2 1.6v7.3l3.6 2.7v2.2L0 12.6l-5.6 1.2v-2.2L-2 8.9V1.6l-12 3.2V2.2L-2-4v-7.8C-2-13.6-1.3-15 0-15z';
const KTI=[11.36005,104.92125];

/* ---------- map ---------- */
const map=L.map('map',{zoomControl:false,worldCopyJump:true,minZoom:2,preferCanvas:false}).setView(KTI,8);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:18,
  attribution:'Tiles © Esri · Data: airplanes.live / OpenSky'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:18,opacity:.85}).addTo(map);

/* ---------- airports ---------- */
const AIRPORTS=[
 ['KTI','VDTI','Techo International','Phnom Penh, Cambodia',11.36005,104.92125,1],
 ['SAI','VDSA','Siem Reap–Angkor','Siem Reap, Cambodia',13.3768,104.2236,1],
 ['KOS','VDSV','Sihanouk International','Sihanoukville, Cambodia',10.5797,103.6370,1],
 ['BKK','VTBS','Suvarnabhumi','Bangkok, Thailand',13.6900,100.7501],
 ['DMK','VTBD','Don Mueang','Bangkok, Thailand',13.9126,100.6068],
 ['SGN','VVTS','Tan Son Nhat','Ho Chi Minh City, Vietnam',10.8188,106.6519],
 ['HAN','VVNB','Noi Bai','Hanoi, Vietnam',21.2212,105.8072],
 ['DAD','VVDN','Da Nang','Da Nang, Vietnam',16.0439,108.1994],
 ['VTE','VLVT','Wattay','Vientiane, Laos',17.9883,102.5633],
 ['RGN','VYYY','Yangon','Yangon, Myanmar',16.9073,96.1332],
 ['KUL','WMKK','Kuala Lumpur','Sepang, Malaysia',2.7456,101.7099],
 ['SIN','WSSS','Changi','Singapore',1.3644,103.9915],
 ['CGK','WIII','Soekarno–Hatta','Jakarta, Indonesia',-6.1256,106.6559],
 ['MNL','RPLL','Ninoy Aquino','Manila, Philippines',14.5086,121.0198],
 ['HKG','VHHH','Hong Kong','Hong Kong',22.3080,113.9185],
 ['CAN','ZGGG','Baiyun','Guangzhou, China',23.3924,113.2988],
 ['TPE','RCTP','Taoyuan','Taipei, Taiwan',25.0797,121.2342],
 ['ICN','RKSI','Incheon','Seoul, South Korea',37.4602,126.4407],
 ['NRT','RJAA','Narita','Tokyo, Japan',35.7720,140.3929],
 ['DXB','OMDB','Dubai','Dubai, UAE',25.2532,55.3657],
 ['DOH','OTHH','Hamad','Doha, Qatar',25.2731,51.6081],
 ['AUH','OMAA','Zayed','Abu Dhabi, UAE',24.4330,54.6511],
 ['LHR','EGLL','Heathrow','London, UK',51.4700,-0.4543],
 ['CDG','LFPG','Charles de Gaulle','Paris, France',49.0097,2.5479],
 ['FRA','EDDF','Frankfurt','Frankfurt, Germany',50.0379,8.5622],
 ['JFK','KJFK','John F. Kennedy','New York, USA',40.6413,-73.7781],
 ['LAX','KLAX','Los Angeles','Los Angeles, USA',33.9416,-118.4085],
 ['SYD','YSSY','Kingsford Smith','Sydney, Australia',-33.9399,151.1753]
];
const apLayer=L.layerGroup().addTo(map);
AIRPORTS.forEach(([iata,icao,name,city,lat,lon,home])=>{
  const m=L.marker([lat,lon],{icon:L.divIcon({className:'',html:'<div class="ap'+(home?' home':'')+'"><i><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></i><b>'+iata+'</b></div>',iconSize:[0,0]}),zIndexOffset:1000,keyboard:false});
  m.on('click',e=>{L.DomEvent.stopPropagation(e);showAirport(iata,icao,name,city,lat,lon)});
  apLayer.addLayer(m);
});
function apVis(){const z=map.getZoom();document.body.classList.toggle('ap-min',z<5)}
map.on('zoomend',apVis);apVis();
function showAirport(iata,icao,name,city,lat,lon){
  deselect();
  let n=0,arr=0,dep=0;
  for(const[,p]of planes){const d=p.d;if(map.distance([lat,lon],[d.lat,d.lon])<40*1852){n++;if(!d.gnd&&(d.alt||0)<12000){if((d.vr||0)<-300)arr++;else if((d.vr||0)>300)dep++}}}
  const sh=$('sheet');
  sh.innerHTML='<button class="x" aria-label="Close">×</button><div class="cs">'+iata+' <small style="font-size:.9rem;color:var(--mute);font-weight:600">'+icao+'</small></div>'+
   '<div class="sub">'+esc(name)+' · '+esc(city)+'</div>'+
   '<div class="grid"><div><span>Nearby</span><b>'+n+'</b></div><div><span>Arriving</span><b>'+arr+'</b></div><div><span>Departing</span><b>'+dep+'</b></div></div>'+
   '<p class="sub" style="margin-top:10px">Planes within 40 nm, from the data loaded on screen.</p>'+
   '<div class="links"><a href="https://www.flightradar24.com/airport/'+iata.toLowerCase()+'" target="_blank" rel="noopener">Airport on FR24 ↗</a><a href="#" id="apZoom">Zoom in</a></div>';
  sh.querySelector('.x').onclick=deselect;
  sh.querySelector('#apZoom').onclick=e=>{e.preventDefault();map.flyTo([lat,lon],11,{duration:1.1})};
  sh.classList.add('on');document.body.classList.add('sheet-on');
}

/* ---------- helpers ---------- */
function altColor(ft){
  if(ft==null)return '#94a3b8';
  const stops=[[0,[250,204,21]],[10000,[34,197,94]],[20000,[6,182,212]],[30000,[59,130,246]],[38000,[168,85,247]],[45000,[236,72,153]]];
  if(ft<=0)return 'rgb(250,204,21)';
  for(let i=1;i<stops.length;i++)if(ft<=stops[i][0]){const[a,c1]=stops[i-1],[b,c2]=stops[i],k=(ft-a)/(b-a);
    return 'rgb('+c1.map((v,j)=>Math.round(v+(c2[j]-v)*k)).join(',')+')'}
  return 'rgb(236,72,153)';
}
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
const COMP=['N','NE','E','SE','S','SW','W','NW'];
const compass=d=>d==null?'':COMP[Math.round(((d%360)+360)%360/45)%8];
const EMG={'7700':'Emergency','7600':'Radio failure','7500':'Hijack code'};
function toast(t,ms=2500){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),ms)}

/* ---------- data sources ---------- */
const RELAYS=[u=>u,u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?url='+encodeURIComponent(u)];
function getJSON(u){
  return Promise.any(RELAYS.map((r,i)=>new Promise((res,rej)=>setTimeout(()=>{
    const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);
    fetch(r(u),{signal:c.signal,cache:'no-store'}).then(x=>{if(!x.ok)throw 0;return x.json()}).then(j=>{clearTimeout(t);res(j)}).catch(e=>{clearTimeout(t);rej(e)})
  },i*700))));
}
// airplanes.live / adsb.lol (readsb format)
function normReadsb(a){
  if(a.lat==null||a.lon==null)return null;
  const gnd=a.alt_baro==='ground';
  return{hex:a.hex,cs:(a.flight||'').trim(),reg:a.r||'',type:a.t||'',desc:a.desc||'',lat:a.lat,lon:a.lon,
    alt:gnd?0:(typeof a.alt_baro==='number'?a.alt_baro:a.alt_geom??null),gnd,gs:a.gs??null,trk:a.track??a.true_heading??null,
    vr:a.baro_rate??a.geom_rate??null,sq:a.squawk||'',src:'airplanes.live'};
}
// OpenSky state vectors
function normOpensky(s){
  if(s[5]==null||s[6]==null)return null;
  return{hex:s[0],cs:(s[1]||'').trim(),reg:'',type:'',desc:'',country:s[2],lat:s[6],lon:s[5],
    alt:s[8]?0:(s[7]!=null?s[7]*3.28084:null),gnd:!!s[8],gs:s[9]!=null?s[9]*1.94384:null,trk:s[10],
    vr:s[11]!=null?s[11]*196.85:null,sq:s[14]||'',src:'OpenSky'};
}
const SRCSTAT={};
function setStatus(t){$('srcl').textContent=t}
function tryOne(name,u,norm,pick){
  SRCSTAT[name]='…';
  return getJSON(u).then(j=>{const raw=pick(j);if(!Array.isArray(raw))throw new Error('bad data');
    const l=raw.map(norm).filter(Boolean);SRCSTAT[name]=l.length;if(!l.length)throw new Error('empty');return{l,name}})
   .catch(e=>{if(SRCSTAT[name]==='…')SRCSTAT[name]='✕';console.warn('[LiquidTracker]',name,'failed:',e&&e.message||e);throw e});
}
async function fetchView(){
  const b=map.getBounds(),c=map.getCenter(),z=map.getZoom(),jobs=[];
  if(z>=5){
    const r=Math.min(250,Math.ceil(c.distanceTo(b.getNorthEast())/1852));
    const pth='/point/'+c.lat.toFixed(3)+'/'+c.lng.toFixed(3)+'/'+r,pk=j=>j.ac||j.aircraft;
    jobs.push(tryOne('airplanes.live','https://api.airplanes.live/v2'+pth,normReadsb,pk));
    jobs.push(tryOne('adsb.lol','https://api.adsb.lol/v2'+pth,normReadsb,pk));
  }
  const s0=Math.max(-85,b.getSouth()),n0=Math.min(85,b.getNorth());let w=b.getWest(),e=b.getEast();if(e-w>=360){w=-180;e=180}
  jobs.push(tryOne('OpenSky','https://opensky-network.org/api/states/all?lamin='+s0.toFixed(2)+'&lomin='+Math.max(-180,w).toFixed(2)+'&lamax='+n0.toFixed(2)+'&lomax='+Math.min(180,e).toFixed(2),normOpensky,j=>j.states||[]));
  setStatus('Loading…');
  try{const r=await Promise.any(jobs);setStatus('via '+r.name);return r.l}
  catch(e){
    const empty=Object.values(SRCSTAT).some(v=>v===0);
    if(empty){setStatus('No planes reported here');return[]}
    setStatus('Data blocked: tap for help');throw e;
  }
}
/* ---------- planes on map ---------- */
const planes=new Map();   // hex -> {d, m, trail:[]}
let selHex=null,trailLine=null,busy=false,lastOk=0,fails=0;
const MAXDRAW=1500;
function iconHTML(d){
  const col=d.gnd?'#94a3b8':altColor(d.alt);
  return '<svg viewBox="-16 -16 32 32" style="transform:rotate('+(d.trk||0)+'deg)"><path fill="'+col+'" d="'+PATH+'"/></svg>';
}
function makeIcon(d){
  const cls='pl'+(EMG[d.sq]?' emg':'')+(d.hex===selHex?' sel':'');
  return L.divIcon({className:'',html:'<div class="'+cls+'" style="position:relative">'+iconHTML(d)+'</div>',iconSize:[0,0]});
}
function render(list){
  const seen=new Set(),inView=map.getBounds().pad(.1);
  let shown=0;
  list.sort((a,b)=>(b.hex===selHex)-(a.hex===selHex));
  for(const d of list){
    if(!d.hex)continue;seen.add(d.hex);
    let p=planes.get(d.hex);
    if(!p){p={d,trail:[]};planes.set(d.hex,p)}
    p.d=d;p.trail.push([d.lat,d.lon]);if(p.trail.length>120)p.trail.shift();
    const vis=inView.contains([d.lat,d.lon])&&(shown<MAXDRAW||d.hex===selHex);
    if(vis){shown++;
      const key=(d.trk|0)+'|'+(d.gnd?'g':Math.round((d.alt||0)/500))+'|'+d.sq+'|'+(d.hex===selHex);
      if(!p.m){p.m=L.marker([d.lat,d.lon],{icon:makeIcon(d),keyboard:false}).addTo(map);p.k=key;
        p.m.on('click',()=>select(d.hex))}
      else{p.m.setLatLng([d.lat,d.lon]);if(p.k!==key){p.m.setIcon(makeIcon(d));p.k=key}}
    }else if(p.m){map.removeLayer(p.m);p.m=null}
  }
  for(const[h,p]of planes)if(!seen.has(h)){if(p.m)map.removeLayer(p.m);if(h!==selHex)planes.delete(h)}
  $('cnt').textContent=shown.toLocaleString('en-US');
  if(selHex){const p=planes.get(selHex);if(p&&seen.has(selHex))showSheet(p);else if(p)markLost()}
  searchUpdate();
}
async function tick(){
  if(busy||document.hidden)return;busy=true;
  try{const list=await fetchView();render(list);lastOk=Date.now();fails=0;$('dot').className='live'}
  catch(e){fails++;$('dot').className='err';if(fails===1)toast('Couldn’t reach the flight data right now. Retrying…')}
  busy=false;
}
let tmr=null;
function schedule(){clearInterval(tmr);const z=map.getZoom();tmr=setInterval(tick,z>=6?6000:15000)}
let mv=null;map.on('moveend',()=>{clearTimeout(mv);mv=setTimeout(()=>{tick();schedule()},400)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

/* ---------- plain-English flight brief (no AI key needed) ---------- */
function brief(d){
  if(d.gnd)return (d.gs||0)>40?'Rolling fast on the runway, likely taking off or just landed.':(d.gs||0)>3?'Taxiing on the ground.':'Parked on the ground.';
  const alt=d.alt,vr=d.vr||0,gs=d.gs||0,dir=compass(d.trk);
  let s;
  if(vr>500)s=alt<10000?'Climbing out after take-off':'Climbing';
  else if(vr<-500)s=alt<10000?'Descending on approach':'Descending';
  else s=alt>25000?'Cruising':'Level';
  s+=' at '+fmt(alt)+' ft, '+fmt(gs)+' kt heading '+dir+'.';
  if(vr>500||vr<-500)s+=' '+(vr>0?'Up':'Down')+' about '+fmt(Math.abs(vr))+' ft per minute.';
  if(alt<4000&&vr<-300)s+=' Probably landing within a few minutes.';
  if(gs>550)s+=' Strong tailwind, it is moving fast over the ground.';
  if(EMG[d.sq])s='⚠️ Squawking '+d.sq+' ('+EMG[d.sq].toLowerCase()+'). '+s;
  return s;
}
function phase(d){if(d.gnd)return'On ground';const v=d.vr||0;return v>500?'Climbing':v<-500?'Descending':d.alt>25000?'Cruise':'Level'}

/* ---------- selection / sheet ---------- */
function select(hex){
  if(selHex&&selHex!==hex){const o=planes.get(selHex);if(o&&o.m){o.k=null}}
  selHex=hex;const p=planes.get(hex);if(!p)return;
  p.k=null;if(p.m)p.m.setIcon(makeIcon(p.d));
  showSheet(p,true);$('results').classList.remove('on');
}
function showSheet(p,first){
  const d=p.d,sh=$('sheet');
  if(trailLine)map.removeLayer(trailLine);
  if(p.trail.length>1)trailLine=L.polyline(p.trail,{color:altColor(d.alt),weight:2.5,opacity:.8,dashArray:'1 6',lineCap:'round'}).addTo(map);
  const id=d.cs||d.reg||d.hex.toUpperCase();
  sh.innerHTML='<button class="x" aria-label="Close">×</button>'+
    '<div class="cs">'+esc(id)+'</div>'+
    '<div class="sub">'+esc([d.desc||d.type,d.reg,d.country].filter(Boolean).join(' · ')||'Aircraft '+d.hex.toUpperCase())+'</div>'+
    '<div class="badges"><span class="ph">'+phase(d)+'</span>'+(d.type?'<span>'+esc(d.type)+'</span>':'')+(d.sq?'<span'+(EMG[d.sq]?' class="em"':'')+'>Squawk '+esc(d.sq)+'</span>':'')+'<span>'+esc(d.src)+'</span></div>'+
    '<div class="brief"><small>FLIGHT BRIEF</small>'+esc(brief(d))+'</div>'+
    '<div class="grid"><div><span>Altitude</span><b>'+(d.gnd?'Ground':fmt(d.alt)+'<small>ft</small>')+'</b></div>'+
    '<div><span>Speed</span><b>'+fmt(d.gs)+'<small>kt</small></b></div>'+
    '<div><span>Heading</span><b>'+(d.trk==null?'—':Math.round(d.trk)+'°<small>'+compass(d.trk)+'</small>')+'</b></div></div>'+
    '<div class="links"><a href="https://www.flightradar24.com/'+encodeURIComponent(d.cs||d.reg||'')+'" target="_blank" rel="noopener">Flightradar24 ↗</a>'+
    (d.reg?'<a href="https://www.jetphotos.com/registration/'+encodeURIComponent(d.reg)+'" target="_blank" rel="noopener">Photos ↗</a>':'')+'</div>';
  sh.querySelector('.x').onclick=deselect;
  sh.classList.add('on');document.body.classList.add('sheet-on');
  if(first&&!map.getBounds().pad(-.2).contains([d.lat,d.lon]))map.panTo([d.lat,d.lon]);
}
function markLost(){const b=$('sheet').querySelector('.ph');if(b)b.textContent='Out of range'}
function deselect(){
  const p=planes.get(selHex);selHex=null;if(p&&p.m){p.k=null;p.m.setIcon(makeIcon(p.d))}
  if(trailLine){map.removeLayer(trailLine);trailLine=null}
  $('sheet').classList.remove('on');document.body.classList.remove('sheet-on');
}
map.on('click',deselect);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){deselect();$('results').classList.remove('on')}});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- search ---------- */
function searchUpdate(){
  const q=$('q').value.trim().toUpperCase(),box=$('results');
  if(q.length<2){box.classList.remove('on');return}
  const hits=[];for(const[h,p]of planes){const d=p.d;if((d.cs+' '+d.reg+' '+d.type+' '+h).toUpperCase().includes(q))hits.push(d);if(hits.length>=8)break}
  box.innerHTML=hits.length?hits.map(d=>'<button data-h="'+d.hex+'"><span><b>'+esc(d.cs||d.reg||d.hex)+'</b> <small>'+esc([d.type,d.reg].filter(Boolean).join(' · '))+'</small></span><small>'+(d.gnd?'Ground':fmt(d.alt)+' ft')+'</small></button>').join('')
    :'<button disabled><small>No match in the planes loaded here. Zoom out or move the map.</small></button>';
  box.classList.add('on');
  box.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const p=planes.get(b.dataset.h);if(p){map.setView([p.d.lat,p.d.lon],Math.max(map.getZoom(),8));select(b.dataset.h)}});
}
$('q').addEventListener('input',searchUpdate);
$('q').addEventListener('focus',searchUpdate);

/* ---------- buttons ---------- */
$('bKti').onclick=()=>map.flyTo(KTI,10,{duration:1.2});
$('bWorld').onclick=()=>map.flyTo([20,10],2,{duration:1.2});
$('bMe').onclick=()=>{if(!navigator.geolocation)return toast('Location isn’t available on this device.');
  navigator.geolocation.getCurrentPosition(p=>map.flyTo([p.coords.latitude,p.coords.longitude],9,{duration:1.2}),()=>toast('Location permission was denied.'))};

$('stat').onclick=()=>{const t=Object.entries(SRCSTAT).map(([k,v])=>k+': '+(v==='✕'?'failed':v==='…'?'waiting':v+' planes')).join(' · ');toast(t||'Nothing tried yet',5000)};
tick();schedule();
</script>
